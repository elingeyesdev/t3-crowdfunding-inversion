<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1349" role="img" aria-labelledby="title desc">
<title id="title">CU-C07 · Consultar notificaciones</title><desc id="desc">Actividad vertical del caso de uso. El recorrido principal baja por No en cada alternativa. Sí conduce a su respuesta y a la continuidad indicada por número de paso o caso.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#546b7b"/></marker></defs>
<rect width="1050" height="1349" fill="white"/>
<text x="525" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203a4a">CU-C07 · Consultar notificaciones</text>
<text x="525" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#203a4a">Recorrido principal hacia abajo · Alternativas a la derecha</text>
<rect x="40" y="99.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Inicio</text>
<polyline points="300,163.0 300,215.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="215.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · Usuario con cuenta: Abre la campana o el centro de</text>
<text x="300" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">notificaciones.</text>
<polyline points="300,295.0 300,347.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="347.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="380.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · UniFundme: Carga sus avisos y el indicador de no</text>
<text x="300" y="404.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">leídas.</text>
<polyline points="300,427.0 300,479.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="479.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="512.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · Usuario con cuenta: Aplica los filtros disponibles y</text>
<text x="300" y="536.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">recorre las páginas.</text>
<polyline points="300,559.0 300,611.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="300,611.0 560,691.0 300,771.0 40,691.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="696.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · ¿No hay avisos coincidentes?</text>
<polyline points="560,691.0 655,691.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="679.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="613.0" width="355" height="156" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="648.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · Presenta el estado vacío y</text>
<text x="832" y="672.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Restablecer filtros permite quitar las</text>
<text x="832" y="696.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">selecciones.</text>
<text x="832" y="720.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Retomar el paso 2 o</text>
<text x="832" y="744.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">terminar.</text>
<polyline points="300,771.0 300,823.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="795.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<rect x="40" y="823.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="856.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · UniFundme: Muestra los avisos coincidentes de su</text>
<text x="300" y="880.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">cuenta.</text>
<polyline points="300,903.0 300,955.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="955.0" width="520" height="64" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="992.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · Usuario con cuenta: Abre una notificación.</text>
<polyline points="300,1019.0 300,1071.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1071.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1104.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · UniFundme: Registra la lectura y navega al destino si</text>
<text x="300" y="1128.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">el aviso tiene uno asociado.</text>
<polyline points="300,1151.0 300,1203.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1203.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="1240.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Fin del recorrido principal</text>
<text x="525" y="1319" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Las alternativas indican dónde retomar o terminar; no todas concluyen en éxito.</text>
</svg>