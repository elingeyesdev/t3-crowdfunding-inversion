<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1801" role="img" aria-labelledby="title desc">
<title id="title">CU-A08 · Auditar movimientos financieros</title><desc id="desc">Actividad vertical del caso de uso. El recorrido principal baja por No en cada alternativa. Sí conduce a su respuesta y a la continuidad indicada por número de paso o caso.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#546b7b"/></marker></defs>
<rect width="1050" height="1801" fill="white"/>
<text x="525" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203a4a">CU-A08 · Auditar movimientos financieros</text>
<text x="525" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#203a4a">Recorrido principal hacia abajo · Alternativas a la derecha</text>
<rect x="40" y="99.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Inicio</text>
<polyline points="300,163.0 300,215.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="215.0" width="520" height="104" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · Administrador: Busca por concepto, factura, notas o</text>
<text x="300" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">campaña y aplica tipo, estado o comprobante; recorre las</text>
<text x="300" y="296.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">páginas.</text>
<polyline points="300,319.0 300,371.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="371.0" width="520" height="64" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="408.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · UniFundme: Presenta movimientos coincidentes.</text>
<polyline points="300,435.0 300,487.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="487.0" width="520" height="64" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="524.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · Administrador: Pulsa Revisar en un movimiento.</text>
<polyline points="300,551.0 300,603.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="603.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="636.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · UniFundme: Carga importe, categoría, comprobante</text>
<text x="300" y="660.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">disponible e Historial de cambios y revisiones.</text>
<polyline points="300,683.0 300,735.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="735.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="768.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · Administrador: Elige Aprobar / Verificado y pulsa</text>
<text x="300" y="792.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Confirmar Dictamen.</text>
<polyline points="300,815.0 300,867.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="300,867.0 560,947.0 300,1027.0 40,947.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="940.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · ¿Prefiere Marcar Observado o</text>
<text x="300" y="964.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Rechazar?</text>
<polyline points="560,947.0 655,947.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="935.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="881.0" width="355" height="132" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="916.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · Exige explicación para completar</text>
<text x="832" y="940.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">ese dictamen.</text>
<text x="832" y="964.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Añadir explicación y</text>
<text x="832" y="988.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">retomar el paso 3.</text>
<polyline points="300,1027.0 300,1079.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="1051.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<polygon points="300,1079.0 560,1159.0 300,1239.0 40,1159.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="1152.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A2 · ¿Cambió la versión o el</text>
<text x="300" y="1176.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">movimiento no admite revisión?</text>
<polyline points="560,1159.0 655,1159.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="1147.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="1081.0" width="355" height="156" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="1116.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A2 · No sobrescribe otra revisión;</text>
<text x="832" y="1140.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">requiere recargar o limitarse a</text>
<text x="832" y="1164.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">consultar.</text>
<text x="832" y="1188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Volver al paso 2 o</text>
<text x="832" y="1212.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">terminar con consulta.</text>
<polyline points="300,1239.0 300,1291.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="1263.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<rect x="40" y="1291.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1324.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · UniFundme: Comprueba permisos y versión y registra</text>
<text x="300" y="1348.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">el dictamen si el movimiento admite revisión.</text>
<polyline points="300,1371.0 300,1423.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1423.0" width="520" height="64" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="1460.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">4 · Administrador: Consulta el resultado.</text>
<polyline points="300,1487.0 300,1539.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1539.0" width="520" height="64" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1576.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">4 · UniFundme: Actualiza lista, resumen e historial.</text>
<polyline points="300,1603.0 300,1655.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1655.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="1692.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Fin del recorrido principal</text>
<text x="525" y="1771" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Las alternativas indican dónde retomar o terminar; no todas concluyen en éxito.</text>
</svg>