<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1569" role="img" aria-labelledby="title desc">
<title id="title">CU-E06 · Definir niveles de recompensa</title><desc id="desc">Actividad vertical del caso de uso. El recorrido principal baja por No en cada alternativa. Sí conduce a su respuesta y a la continuidad indicada por número de paso o caso.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#546b7b"/></marker></defs>
<rect width="1050" height="1569" fill="white"/>
<text x="525" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203a4a">CU-E06 · Definir niveles de recompensa</text>
<text x="525" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#203a4a">Recorrido principal hacia abajo · Alternativas a la derecha</text>
<rect x="40" y="99.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Inicio</text>
<polyline points="300,163.0 300,215.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="215.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · Emprendedor: Abre Estructura de Recompensas y usa</text>
<text x="300" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Agregar Nivel.</text>
<polyline points="300,295.0 300,347.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="347.0" width="520" height="64" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="384.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · UniFundme: Presenta los campos del nivel.</text>
<polyline points="300,411.0 300,463.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="463.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="496.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · Emprendedor: Completa título, descripción y</text>
<text x="300" y="520.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">porcentajes válidos.</text>
<polyline points="300,543.0 300,595.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="300,595.0 560,675.0 300,755.0 40,675.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="668.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · ¿Desea cambiar o quitar una</text>
<text x="300" y="692.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">definición antes de guardar?</text>
<polyline points="560,675.0 655,675.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="663.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="621.0" width="355" height="108" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="656.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · Editar Nivel o Eliminar Nivel</text>
<text x="832" y="680.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">modifica la lista del formulario.</text>
<text x="832" y="704.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Retomar el paso 2 o 3.</text>
<polyline points="300,755.0 300,807.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="779.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<polygon points="300,807.0 560,887.0 300,967.0 40,887.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="880.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A2 · ¿El rango de porcentajes es</text>
<text x="300" y="904.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">inválido?</text>
<polyline points="560,887.0 655,887.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="875.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="821.0" width="355" height="132" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="856.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A2 · No incorpora el nivel con esos</text>
<text x="832" y="880.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">porcentajes.</text>
<text x="832" y="904.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Corregir y retomar el</text>
<text x="832" y="928.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">paso 2.</text>
<polyline points="300,967.0 300,1019.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="991.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<rect x="40" y="1019.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1052.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · UniFundme: Añade el nivel a la lista del formulario si 0</text>
<text x="300" y="1076.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">≤ mínimo &lt; máximo ≤ 100.</text>
<polyline points="300,1099.0 300,1151.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1151.0" width="520" height="64" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="1188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · Emprendedor: Guarda la campaña.</text>
<polyline points="300,1215.0 300,1267.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1267.0" width="520" height="104" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1300.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · UniFundme: Conserva las definiciones guardadas y</text>
<text x="300" y="1324.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">permite consultarlas en Recompensas de Vista Previa</text>
<text x="300" y="1348.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">cuando existen niveles.</text>
<polyline points="300,1371.0 300,1423.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1423.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="1460.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Fin del recorrido principal</text>
<text x="525" y="1539" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Las alternativas indican dónde retomar o terminar; no todas concluyen en éxito.</text>
</svg>