<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 2265" role="img" aria-labelledby="title desc">
<title id="title">Casos de uso · Emprendedor</title><desc id="desc">Diagrama UML: actor fuera del límite UniFundme web; óvalos dentro del sistema y líneas de asociación. La disposición es vertical, no representa una secuencia.</desc>
