<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1529" role="img" aria-labelledby="title desc">
<title id="title">CU-V04 · Consultar Historia y Proyecto</title><desc id="desc">Actividad vertical del caso de uso. El recorrido principal baja por No en cada alternativa. Sí conduce a su respuesta y a la continuidad indicada por número de paso o caso.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#546b7b"/></marker></defs>
<rect width="1050" height="1529" fill="white"/>
<text x="525" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203a4a">CU-V04 · Consultar Historia y Proyecto</text>
<text x="525" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#203a4a">Recorrido principal hacia abajo · Alternativas a la derecha</text>
<rect x="40" y="99.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Inicio</text>
<polyline points="300,163.0 300,215.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="215.0" width="520" height="64" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · Visitante: Selecciona Historia y Proyecto.</text>
<polyline points="300,279.0 300,331.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="331.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="364.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · UniFundme: Presenta Historia del Proyecto y Sobre el</text>
<text x="300" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Emprendedor.</text>
<polyline points="300,411.0 300,463.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="463.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="496.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · Visitante: Lee la descripción y los datos disponibles del</text>
<text x="300" y="520.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">creador.</text>
<polyline points="300,543.0 300,595.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="300,595.0 560,675.0 300,755.0 40,675.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="668.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A2 · ¿La campaña no tiene</text>
<text x="300" y="692.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">recompensas?</text>
<polyline points="560,675.0 655,675.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="663.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="609.0" width="355" height="132" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="644.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A2 · La lectura del proyecto continúa</text>
<text x="832" y="668.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">sin niveles de recompensa.</text>
<text x="832" y="692.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Retomar el paso 3 o</text>
<text x="832" y="716.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">terminar.</text>
<polyline points="300,755.0 300,807.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="779.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<rect x="40" y="807.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="840.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · UniFundme: Muestra además Niveles de Recompensa</text>
<text x="300" y="864.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">cuando existen niveles.</text>
<polyline points="300,887.0 300,939.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="939.0" width="520" height="64" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="976.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · Visitante: Selecciona Ver Transparencia.</text>
<polyline points="300,1003.0 300,1055.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="300,1055.0 560,1135.0 300,1215.0 40,1135.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="1140.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · ¿Prefiere contactar al creador?</text>
<polyline points="560,1135.0 655,1135.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="1123.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="1057.0" width="355" height="156" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="1092.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · Usa Contactar Emprendedor en</text>
<text x="832" y="1116.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Sobre el Emprendedor; el contacto</text>
<text x="832" y="1140.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">requiere sesión y no se ofrece para sí</text>
<text x="832" y="1164.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">mismo.</text>
<text x="832" y="1188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Continuar en CU-C05.</text>
<polyline points="300,1215.0 300,1267.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="1239.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<rect x="40" y="1267.0" width="520" height="64" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1304.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · UniFundme: Cambia a Transparencia y Fondos.</text>
<polyline points="300,1331.0 300,1383.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1383.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="1420.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Fin del recorrido principal</text>
<text x="525" y="1499" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Las alternativas indican dónde retomar o terminar; no todas concluyen en éxito.</text>
</svg>