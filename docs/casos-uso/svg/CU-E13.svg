<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1597" role="img" aria-labelledby="title desc">
<title id="title">CU-E13 · Publicar novedades</title><desc id="desc">Actividad vertical del caso de uso. El recorrido principal baja por No en cada alternativa. Sí conduce a su respuesta y a la continuidad indicada por número de paso o caso.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#546b7b"/></marker></defs>
<rect width="1050" height="1597" fill="white"/>
<text x="525" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203a4a">CU-E13 · Publicar novedades</text>
<text x="525" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#203a4a">Recorrido principal hacia abajo · Alternativas a la derecha</text>
<rect x="40" y="99.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Inicio</text>
<polyline points="300,163.0 300,215.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="215.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · Emprendedor: En Mis Campañas pulsa Publicar</text>
<text x="300" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Novedad en la tarjeta.</text>
<polyline points="300,295.0 300,347.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="347.0" width="520" height="64" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="384.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">1 · UniFundme: Abre el formulario de publicación.</text>
<polyline points="300,411.0 300,463.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="463.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="496.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · Emprendedor: Escribe título de al menos 3 caracteres y</text>
<text x="300" y="520.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">contenido de al menos 10; elige texto o el tipo de adjunto.</text>
<polyline points="300,543.0 300,595.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="300,595.0 560,675.0 300,755.0 40,675.0" fill="#fff3d8" stroke="#aa8533"/>
<text x="300" y="668.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · ¿Faltan caracteres requeridos o el</text>
<text x="300" y="692.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">archivo del tipo elegido?</text>
<polyline points="560,675.0 655,675.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="609" y="663.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Sí</text>
<rect x="655" y="609.0" width="355" height="132" rx="10" fill="#fff7e9" stroke="#b9944a"/>
<text x="832" y="644.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">A1 · Solicita completar los datos antes</text>
<text x="832" y="668.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">de publicar.</text>
<text x="832" y="692.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Continuidad: Corregir y retomar el</text>
<text x="832" y="716.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">paso 2.</text>
<polyline points="300,755.0 300,807.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="323" y="779.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">No</text>
<rect x="40" y="807.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="840.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">2 · UniFundme: Valida campos y solicita archivo si el tipo</text>
<text x="300" y="864.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">elegido lo requiere.</text>
<polyline points="300,887.0 300,939.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="939.0" width="520" height="64" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="976.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · Emprendedor: Pulsa Publicar.</text>
<polyline points="300,1003.0 300,1055.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1055.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1088.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">3 · UniFundme: Registra la novedad pública si la</text>
<text x="300" y="1112.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">operación es correcta.</text>
<polyline points="300,1135.0 300,1187.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1187.0" width="520" height="80" rx="10" fill="#eef4fa" stroke="#9bafbe"/>
<text x="300" y="1220.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">4 · Emprendedor: Consulta Hitos y Avances o</text>
<text x="300" y="1244.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Transparencia y Fondos → Bitácora.</text>
<polyline points="300,1267.0 300,1319.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1319.0" width="520" height="80" rx="10" fill="#eaf5ef" stroke="#9bafbe"/>
<text x="300" y="1352.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">4 · UniFundme: Presenta la novedad; los donadores</text>
<text x="300" y="1376.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">vinculados pueden consultarla en Mi Panel → Novedades.</text>
<polyline points="300,1399.0 300,1451.0" fill="none" stroke="#546b7b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1451.0" width="520" height="64" rx="30" fill="#e5f2df" stroke="#9bafbe"/>
<text x="300" y="1488.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#203a4a">Fin del recorrido principal</text>
<text x="525" y="1567" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#203a4a">Las alternativas indican dónde retomar o terminar; no todas concluyen en éxito.</text>
</svg>