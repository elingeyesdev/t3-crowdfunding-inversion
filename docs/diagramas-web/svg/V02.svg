<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 2290" role="img" aria-labelledby="title desc">
<title id="title">V02 · Consultar una campaña</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 315.0"/>
<path class="edge" d="M 290 445.0 V 488.0"/>
<text class="label" x="305" y="471.5">Sí</text>
<path class="edge" d="M 485 380 H 590"/>
<text class="label" x="535" y="370" text-anchor="middle">No</text>
<a href="../index.html#V01" aria-label="Ir a V01">
<rect x="590.0" y="345.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="375" text-anchor="middle">
<tspan x="785" dy="0">Volver a Explorar; si falló la carga,</tspan>
<tspan x="785" dy="22">usar Reintentar</tspan>
</text>
</a>
<path class="edge" d="M 290 572.0 V 638.0"/>
<path class="edge" d="M 290 722.0 V 788.0"/>
<path class="edge" d="M 290 872.0 V 915.0"/>
<path class="edge" d="M 290 1045.0 V 1065.0"/>
<text class="label" x="305" y="1060.0">No</text>
<path class="edge" d="M 485 980 H 590"/>
<text class="label" x="535" y="970" text-anchor="middle">Sí</text>
<rect x="590.0" y="938.0" width="390" height="84" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="964" text-anchor="middle">
<tspan x="785" dy="0">Pulsar Historia y Proyecto; leer</tspan>
<tspan x="785" dy="22">Historia del Proyecto, recompensas y</tspan>
<tspan x="785" dy="22">Sobre el Emprendedor</tspan>
</text>
<path class="edge" d="M 290 1195.0 V 1215.0"/>
<text class="label" x="305" y="1210.0">No</text>
<path class="edge" d="M 485 1130 H 590"/>
<text class="label" x="535" y="1120" text-anchor="middle">Sí</text>
<a href="../index.html#V06" aria-label="Ir a V06">
<rect x="590.0" y="1095.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1125" text-anchor="middle">
<tspan x="785" dy="0">Pulsar Transparencia y Fondos;</tspan>
<tspan x="785" dy="22">continuar con sus opciones en V06</tspan>
</text>
</a>
<path class="edge" d="M 290 1345.0 V 1365.0"/>
<text class="label" x="305" y="1360.0">No</text>
<path class="edge" d="M 485 1280 H 590"/>
<text class="label" x="535" y="1270" text-anchor="middle">Sí</text>
<rect x="590.0" y="1245.0" width="390" height="70" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1275" text-anchor="middle">
<tspan x="785" dy="0">Pulsar Hitos y Avances; consultar los</tspan>
<tspan x="785" dy="22">hitos y las novedades publicadas</tspan>
</text>
<path class="edge" d="M 290 1495.0 V 1515.0"/>
<text class="label" x="305" y="1510.0">No</text>
<path class="edge" d="M 485 1430 H 590"/>
<text class="label" x="535" y="1420" text-anchor="middle">Sí</text>
<a href="../index.html#C09" aria-label="Ir a C09">
<rect x="590.0" y="1388.0" width="390" height="84" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1414" text-anchor="middle">
<tspan x="785" dy="0">Pulsar Comentarios, a la derecha de</tspan>
<tspan x="785" dy="22">Hitos y Avances; para participar,</tspan>
<tspan x="785" dy="22">seguir C09</tspan>
</text>
</a>
<path class="edge" d="M 290 1645.0 V 1665.0"/>
<text class="label" x="305" y="1660.0">No</text>
<path class="edge" d="M 485 1580 H 590"/>
<text class="label" x="535" y="1570" text-anchor="middle">Sí</text>
<a href="../index.html#D03" aria-label="Ir a D03">
<rect x="590.0" y="1545.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1575" text-anchor="middle">
<tspan x="785" dy="0">Consultar las condiciones del aporte</tspan>
<tspan x="785" dy="22">y continuar con D03</tspan>
</text>
</a>
<path class="edge" d="M 290 1795.0 V 1815.0"/>
<text class="label" x="305" y="1810.0">No</text>
<path class="edge" d="M 485 1730 H 590"/>
<text class="label" x="535" y="1720" text-anchor="middle">Sí</text>
<a href="../index.html#V05" aria-label="Ir a V05">
<rect x="590.0" y="1695.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1725" text-anchor="middle">
<tspan x="785" dy="0">Pulsar Compartir Campaña y continuar</tspan>
<tspan x="785" dy="22">con V05</tspan>
</text>
</a>
<path class="edge" d="M 290 1945.0 V 1995.0"/>
<text class="label" x="305" y="1975.0">No</text>
<path class="edge" d="M 485 1880 H 590"/>
<text class="label" x="535" y="1870" text-anchor="middle">Sí</text>
<a href="../index.html#C03" aria-label="Ir a C03">
<rect x="590.0" y="1838.0" width="390" height="84" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1864" text-anchor="middle">
<tspan x="785" dy="0">En Historia y Proyecto, bajar hasta</tspan>
<tspan x="785" dy="22">Sobre el Emprendedor; continuar con</tspan>
<tspan x="785" dy="22">C03</tspan>
</text>
</a>
<path class="edge" d="M 290 2065.0 V 2145.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="236" text-anchor="middle">
<tspan x="290" dy="0">Abrir la ficha de la campaña</tspan>
</text>
<polygon points="290,315.0 485.0,380 290,445.0 95.0,380" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="386" text-anchor="middle">
<tspan x="290" dy="0">¿La campaña está disponible?</tspan>
</text>
<rect x="95.0" y="488.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="514" text-anchor="middle">
<tspan x="290" dy="0">Leer el título, resumen, creador,</tspan>
<tspan x="290" dy="22">Recaudado, Meta, Donantes y Días</tspan>
<tspan x="290" dy="22">Restantes</tspan>
</text>
<rect x="95.0" y="638.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="664" text-anchor="middle">
<tspan x="290" dy="0">Localizar Historia y Proyecto,</tspan>
<tspan x="290" dy="22">Transparencia y Fondos e Hitos y</tspan>
<tspan x="290" dy="22">Avances</tspan>
</text>
<rect x="95.0" y="788.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="814" text-anchor="middle">
<tspan x="290" dy="0">Si Comentarios no aparece, desplazar</tspan>
<tspan x="290" dy="22">horizontalmente esa misma barra hacia</tspan>
<tspan x="290" dy="22">la derecha</tspan>
</text>
<polygon points="290,915.0 485.0,980 290,1045.0 95.0,980" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="975" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres conocer el</tspan>
<tspan x="290" dy="22">proyecto?</tspan>
</text>
<polygon points="290,1065.0 485.0,1130 290,1195.0 95.0,1130" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1125" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres consultar fondos y</tspan>
<tspan x="290" dy="22">evidencias?</tspan>
</text>
<polygon points="290,1215.0 485.0,1280 290,1345.0 95.0,1280" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1275" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres consultar los</tspan>
<tspan x="290" dy="22">avances?</tspan>
</text>
<polygon points="290,1365.0 485.0,1430 290,1495.0 95.0,1430" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1425" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres leer o publicar</tspan>
<tspan x="290" dy="22">comentarios?</tspan>
</text>
<polygon points="290,1515.0 485.0,1580 290,1645.0 95.0,1580" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1586" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres realizar un aporte?</tspan>
</text>
<polygon points="290,1665.0 485.0,1730 290,1795.0 95.0,1730" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1725" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres compartir la</tspan>
<tspan x="290" dy="22">campaña?</tspan>
</text>
<polygon points="290,1815.0 485.0,1880 290,1945.0 95.0,1880" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1875" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres contactar al</tspan>
<tspan x="290" dy="22">creador?</tspan>
</text>
<a href="../index.html#V01" aria-label="Ir a V01">
<rect x="95.0" y="1995.0" width="390" height="70" rx="8" fill="#e7f3ea" stroke="#a9bdca"/>
<text x="290" y="2025" text-anchor="middle">
<tspan x="290" dy="0">Volver a Explorar para consultar otra</tspan>
<tspan x="290" dy="22">campaña</tspan>
</text>
</a>
<rect x="95.0" y="2145.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="2186" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>