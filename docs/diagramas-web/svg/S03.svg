<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1240" role="img" aria-labelledby="title desc">
<title id="title">S03 · Retirar permisos de un administrador</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 315.0"/>
<path class="edge" d="M 290 445.0 V 495.0"/>
<text class="label" x="305" y="475.0">Sí</text>
<path class="edge" d="M 485 380 H 590"/>
<text class="label" x="535" y="370" text-anchor="middle">No</text>
<rect x="590.0" y="338.0" width="390" height="84" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="364" text-anchor="middle">
<tspan x="785" dy="0">Bloquear la acción: no se retiran los</tspan>
<tspan x="785" dy="22">propios permisos ni los de un</tspan>
<tspan x="785" dy="22">superadministrador</tspan>
</text>
<path class="edge" d="M 290 565.0 V 615.0"/>
<path class="edge" d="M 290 745.0 V 795.0"/>
<text class="label" x="305" y="775.0">Sí</text>
<path class="edge" d="M 485 680 H 590"/>
<text class="label" x="535" y="670" text-anchor="middle">No</text>
<rect x="590.0" y="645.0" width="390" height="70" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="686" text-anchor="middle">
<tspan x="785" dy="0">Cancelar y conservar los permisos</tspan>
</text>
<path class="edge" d="M 290 865.0 V 945.0"/>
<path class="edge" d="M 290 1015.0 V 1095.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="225" text-anchor="middle">
<tspan x="290" dy="0">Seleccionar al administrador en</tspan>
<tspan x="290" dy="22">Gestión de Admins</tspan>
</text>
<polygon points="290,315.0 485.0,380 290,445.0 95.0,380" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="375" text-anchor="middle">
<tspan x="290" dy="0">¿Es otro administrador</tspan>
<tspan x="290" dy="22">común?</tspan>
</text>
<rect x="95.0" y="495.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="536" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Revocar</tspan>
</text>
<polygon points="290,615.0 485.0,680 290,745.0 95.0,680" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="686" text-anchor="middle">
<tspan x="290" dy="0">¿Confirmar la operación?</tspan>
</text>
<rect x="95.0" y="795.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="825" text-anchor="middle">
<tspan x="290" dy="0">Retirar perfil y roles</tspan>
<tspan x="290" dy="22">administrativos; conservar la cuenta</tspan>
</text>
<rect x="95.0" y="945.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="975" text-anchor="middle">
<tspan x="290" dy="0">Comprobar la lista de administradores</tspan>
<tspan x="290" dy="22">actualizada</tspan>
</text>
<rect x="95.0" y="1095.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="1136" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>