<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1390" role="img" aria-labelledby="title desc">
<title id="title">C03 · Iniciar o continuar una conversación</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 315.0"/>
<path class="edge" d="M 290 445.0 V 488.0"/>
<text class="label" x="305" y="471.5">Sí</text>
<path class="edge" d="M 485 380 H 590"/>
<text class="label" x="535" y="370" text-anchor="middle">No</text>
<a href="../index.html#C02" aria-label="Ir a C02">
<rect x="590.0" y="345.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="386" text-anchor="middle">
<tspan x="785" dy="0">Iniciar sesión y volver a la campaña</tspan>
</text>
</a>
<path class="edge" d="M 290 572.0 V 638.0"/>
<path class="edge" d="M 290 722.0 V 795.0"/>
<path class="edge" d="M 290 865.0 V 915.0"/>
<path class="edge" d="M 290 1045.0 V 1095.0"/>
<text class="label" x="305" y="1075.0">Sí</text>
<path class="edge" d="M 485 980 H 590"/>
<text class="label" x="535" y="970" text-anchor="middle">No</text>
<path class="edge" d="M 980 980 H 1010 V 830 H 485"/>
<rect x="590.0" y="945.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="975" text-anchor="middle">
<tspan x="785" dy="0">Revisar la conexión y reintentar el</tspan>
<tspan x="785" dy="22">envío</tspan>
</text>
<path class="edge" d="M 290 1165.0 V 1245.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="225" text-anchor="middle">
<tspan x="290" dy="0">Para contactar al creador, abrir su</tspan>
<tspan x="290" dy="22">campaña y pulsar el botón de mensaje</tspan>
</text>
<polygon points="290,315.0 485.0,380 290,445.0 95.0,380" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="386" text-anchor="middle">
<tspan x="290" dy="0">¿Hay una sesión iniciada?</tspan>
</text>
<rect x="95.0" y="488.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="514" text-anchor="middle">
<tspan x="290" dy="0">Abrir o recuperar la conversación;</tspan>
<tspan x="290" dy="22">también se puede elegir una en</tspan>
<tspan x="290" dy="22">Mensajes</tspan>
</text>
<rect x="95.0" y="638.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="664" text-anchor="middle">
<tspan x="290" dy="0">Leer el historial; subir en la</tspan>
<tspan x="290" dy="22">conversación para cargar mensajes</tspan>
<tspan x="290" dy="22">anteriores</tspan>
</text>
<rect x="95.0" y="795.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="836" text-anchor="middle">
<tspan x="290" dy="0">Escribir el mensaje y pulsar Enviar</tspan>
</text>
<polygon points="290,915.0 485.0,980 290,1045.0 95.0,980" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="986" text-anchor="middle">
<tspan x="290" dy="0">¿Se envió correctamente?</tspan>
</text>
<rect x="95.0" y="1095.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1125" text-anchor="middle">
<tspan x="290" dy="0">Leer la respuesta; seguir conversando</tspan>
<tspan x="290" dy="22">o seleccionar otra conversación</tspan>
</text>
<rect x="95.0" y="1245.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="1286" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>