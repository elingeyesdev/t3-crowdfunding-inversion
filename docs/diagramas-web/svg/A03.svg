<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1390" role="img" aria-labelledby="title desc">
<title id="title">A03 · Revisar, aprobar o rechazar campañas</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 345.0"/>
<path class="edge" d="M 290 415.0 V 495.0"/>
<path class="edge" d="M 290 565.0 V 615.0"/>
<path class="edge" d="M 290 745.0 V 795.0"/>
<text class="label" x="305" y="775.0">Sí</text>
<path class="edge" d="M 485 680 H 590"/>
<text class="label" x="535" y="670" text-anchor="middle">No</text>
<a href="../index.html#E04" aria-label="Ir a E04">
<rect x="590.0" y="638.0" width="390" height="84" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="664" text-anchor="middle">
<tspan x="785" dy="0">Escribir motivo, rechazar y notificar</tspan>
<tspan x="785" dy="22">al emprendedor para corregir y</tspan>
<tspan x="785" dy="22">reenviar</tspan>
</text>
</a>
<path class="edge" d="M 290 865.0 V 915.0"/>
<path class="edge" d="M 290 1045.0 V 1095.0"/>
<text class="label" x="305" y="1075.0">Sí</text>
<path class="edge" d="M 485 980 H 590"/>
<text class="label" x="535" y="970" text-anchor="middle">No</text>
<path class="edge" d="M 980 980 H 1010 V 380 H 485"/>
<rect x="590.0" y="945.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="975" text-anchor="middle">
<tspan x="785" dy="0">Leer el error y volver a cargar la</tspan>
<tspan x="785" dy="22">campaña antes de reintentar</tspan>
</text>
<path class="edge" d="M 290 1165.0 V 1245.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="225" text-anchor="middle">
<tspan x="290" dy="0">Buscar y filtrar campañas pendientes</tspan>
<tspan x="290" dy="22">o en revisión</tspan>
</text>
<rect x="95.0" y="338.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="364" text-anchor="middle">
<tspan x="290" dy="0">Abrir el detalle y examinar</tspan>
<tspan x="290" dy="22">propuesta, propietario, documentos e</tspan>
<tspan x="290" dy="22">historial</tspan>
</text>
<a href="../index.html#A05" aria-label="Ir a A05">
<rect x="95.0" y="495.0" width="390" height="70" rx="8" fill="#e7f3ea" stroke="#a9bdca"/>
<text x="290" y="525" text-anchor="middle">
<tspan x="290" dy="0">Revisar documentos con A05 si es</tspan>
<tspan x="290" dy="22">necesario</tspan>
</text>
</a>
<polygon points="290,615.0 485.0,680 290,745.0 95.0,680" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="675" text-anchor="middle">
<tspan x="290" dy="0">¿La campaña cumple los</tspan>
<tspan x="290" dy="22">criterios de revisión?</tspan>
</text>
<rect x="95.0" y="795.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="825" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Aprobar y completar la</tspan>
<tspan x="290" dy="22">confirmación si se solicita</tspan>
</text>
<polygon points="290,915.0 485.0,980 290,1045.0 95.0,980" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="986" text-anchor="middle">
<tspan x="290" dy="0">¿Se registró la aprobación?</tspan>
</text>
<rect x="95.0" y="1095.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1125" text-anchor="middle">
<tspan x="290" dy="0">La campaña queda Aprobada; el</tspan>
<tspan x="290" dy="22">emprendedor debe lanzarla en E05</tspan>
</text>
<rect x="95.0" y="1245.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="1286" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>