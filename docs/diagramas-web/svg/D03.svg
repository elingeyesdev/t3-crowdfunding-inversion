<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1540" role="img" aria-labelledby="title desc">
<title id="title">D03 · Donar a una campaña</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 315.0"/>
<path class="edge" d="M 290 445.0 V 495.0"/>
<text class="label" x="305" y="475.0">Sí</text>
<path class="edge" d="M 485 380 H 590"/>
<text class="label" x="535" y="370" text-anchor="middle">No</text>
<a href="../index.html#V01" aria-label="Ir a V01">
<rect x="590.0" y="345.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="375" text-anchor="middle">
<tspan x="785" dy="0">Elegir otra campaña: esta está</tspan>
<tspan x="785" dy="22">cerrada, financiada o no disponible</tspan>
</text>
</a>
<path class="edge" d="M 290 565.0 V 615.0"/>
<path class="edge" d="M 290 745.0 V 795.0"/>
<text class="label" x="305" y="775.0">Sí</text>
<path class="edge" d="M 485 680 H 590"/>
<text class="label" x="535" y="670" text-anchor="middle">No</text>
<path class="edge" d="M 980 680 H 1010 V 530 H 485"/>
<rect x="590.0" y="645.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="675" text-anchor="middle">
<tspan x="785" dy="0">Ajustar monto o recompensa: revisar</tspan>
<tspan x="785" dy="22">mínimos, máximos, vigencia y cupos</tspan>
</text>
<path class="edge" d="M 290 865.0 V 915.0"/>
<path class="edge" d="M 290 1045.0 V 1065.0"/>
<text class="label" x="305" y="1060.0">Sí</text>
<path class="edge" d="M 485 980 H 590"/>
<text class="label" x="535" y="970" text-anchor="middle">No</text>
<path class="edge" d="M 980 980 H 1010 V 530 H 485"/>
<rect x="590.0" y="945.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="986" text-anchor="middle">
<tspan x="785" dy="0">Cancelar y volver al formulario</tspan>
</text>
<path class="edge" d="M 290 1195.0 V 1238.0"/>
<text class="label" x="305" y="1221.5">Sí</text>
<path class="edge" d="M 485 1130 H 590"/>
<text class="label" x="535" y="1120" text-anchor="middle">No</text>
<path class="edge" d="M 980 1130 H 1010 V 530 H 485"/>
<rect x="590.0" y="1088.0" width="390" height="84" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1114" text-anchor="middle">
<tspan x="785" dy="0">Leer el error: revisar rol, perfil,</tspan>
<tspan x="785" dy="22">saldo, meta restante o recompensa;</tspan>
<tspan x="785" dy="22">corregir y reintentar</tspan>
</text>
<path class="edge" d="M 290 1322.0 V 1395.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<a href="../index.html#V02" aria-label="Ir a V02">
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#e7f3ea" stroke="#a9bdca"/>
<text x="290" y="236" text-anchor="middle">
<tspan x="290" dy="0">Abrir la campaña elegida</tspan>
</text>
</a>
<polygon points="290,315.0 485.0,380 290,445.0 95.0,380" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="375" text-anchor="middle">
<tspan x="290" dy="0">¿Acepta donaciones y sigue</tspan>
<tspan x="290" dy="22">vigente?</tspan>
</text>
<rect x="95.0" y="495.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="525" text-anchor="middle">
<tspan x="290" dy="0">Ingresar el monto y, opcionalmente,</tspan>
<tspan x="290" dy="22">seleccionar una recompensa</tspan>
</text>
<polygon points="290,615.0 485.0,680 290,745.0 95.0,680" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="675" text-anchor="middle">
<tspan x="290" dy="0">¿Cumple monto y condiciones</tspan>
<tspan x="290" dy="22">de recompensa?</tspan>
</text>
<rect x="95.0" y="795.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="825" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Donar y revisar el resumen de</tspan>
<tspan x="290" dy="22">confirmación</tspan>
</text>
<polygon points="290,915.0 485.0,980 290,1045.0 95.0,980" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="986" text-anchor="middle">
<tspan x="290" dy="0">¿Confirmar el aporte?</tspan>
</text>
<polygon points="290,1065.0 485.0,1130 290,1195.0 95.0,1130" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1125" text-anchor="middle">
<tspan x="290" dy="0">¿El servidor acepta el</tspan>
<tspan x="290" dy="22">aporte?</tspan>
</text>
<rect x="95.0" y="1238.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1264" text-anchor="middle">
<tspan x="290" dy="0">Ver éxito, saldo y recaudación</tspan>
<tspan x="290" dy="22">actualizados; descargar comprobante o</tspan>
<tspan x="290" dy="22">ir a Mi Panel</tspan>
</text>
<rect x="95.0" y="1395.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="1436" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>