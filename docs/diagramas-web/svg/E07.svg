<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1240" role="img" aria-labelledby="title desc">
<title id="title">E07 · Consultar recaudación, estadísticas y donadores</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 345.0"/>
<path class="edge" d="M 290 415.0 V 495.0"/>
<path class="edge" d="M 290 565.0 V 645.0"/>
<path class="edge" d="M 290 715.0 V 765.0"/>
<path class="edge" d="M 290 895.0 V 945.0"/>
<text class="label" x="305" y="925.0">Sí</text>
<path class="edge" d="M 485 830 H 590"/>
<text class="label" x="535" y="820" text-anchor="middle">No</text>
<rect x="590.0" y="795.0" width="390" height="70" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="825" text-anchor="middle">
<tspan x="785" dy="0">Mostrar el listado vacío; volver al</tspan>
<tspan x="785" dy="22">progreso de la campaña</tspan>
</text>
<path class="edge" d="M 290 1015.0 V 1095.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="236" text-anchor="middle">
<tspan x="290" dy="0">Abrir Vista previa de la campaña</tspan>
</text>
<rect x="95.0" y="345.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="386" text-anchor="middle">
<tspan x="290" dy="0">Seleccionar Progreso Económico</tspan>
</text>
<rect x="95.0" y="495.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="525" text-anchor="middle">
<tspan x="290" dy="0">Consultar recaudación, evolución,</tspan>
<tspan x="290" dy="22">desglose y proyección</tspan>
</text>
<rect x="95.0" y="645.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="686" text-anchor="middle">
<tspan x="290" dy="0">Seleccionar Donadores Activos</tspan>
</text>
<polygon points="290,765.0 485.0,830 290,895.0 95.0,830" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="836" text-anchor="middle">
<tspan x="290" dy="0">¿Hay donadores registrados?</tspan>
</text>
<rect x="95.0" y="938.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="964" text-anchor="middle">
<tspan x="290" dy="0">Recorrer las páginas y abrir la ficha</tspan>
<tspan x="290" dy="22">de un donador para consultar sus</tspan>
<tspan x="290" dy="22">datos</tspan>
</text>
<rect x="95.0" y="1095.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
