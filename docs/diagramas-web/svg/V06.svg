<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 2140" role="img" aria-labelledby="title desc">
<title id="title">V06 · Consultar fondos, evidencias e hitos</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 338.0"/>
<path class="edge" d="M 290 422.0 V 488.0"/>
<path class="edge" d="M 290 572.0 V 645.0"/>
<path class="edge" d="M 290 715.0 V 788.0"/>
<path class="edge" d="M 290 872.0 V 945.0"/>
<path class="edge" d="M 290 1015.0 V 1095.0"/>
<path class="edge" d="M 290 1165.0 V 1245.0"/>
<path class="edge" d="M 290 1315.0 V 1365.0"/>
<path class="edge" d="M 290 1495.0 V 1545.0"/>
<text class="label" x="305" y="1525.0">Sí</text>
<path class="edge" d="M 485 1430 H 590"/>
<text class="label" x="535" y="1420" text-anchor="middle">No</text>
<path class="edge" d="M 980 1430 H 1010 V 1730 H 485"/>
<rect x="590.0" y="1388.0" width="390" height="84" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1414" text-anchor="middle">
<tspan x="785" dy="0">La sección muestra No hay evidencias</tspan>
<tspan x="785" dy="22">públicas disponibles; continuar con</tspan>
<tspan x="785" dy="22">Bitácora</tspan>
</text>
<path class="edge" d="M 290 1615.0 V 1688.0"/>
<path class="edge" d="M 290 1772.0 V 1838.0"/>
<path class="edge" d="M 290 1922.0 V 1995.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="225" text-anchor="middle">
<tspan x="290" dy="0">En la barra principal de la campaña,</tspan>
<tspan x="290" dy="22">pulsar Transparencia y Fondos</tspan>
</text>
<rect x="95.0" y="338.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="364" text-anchor="middle">
<tspan x="290" dy="0">Localizar Plan de Fondos, Auditoría y</tspan>
<tspan x="290" dy="22">Movimientos, Hitos del Proyecto,</tspan>
<tspan x="290" dy="22">Evidencias y Bitácora</tspan>
</text>
<rect x="95.0" y="488.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="514" text-anchor="middle">
<tspan x="290" dy="0">Si alguna opción no aparece,</tspan>
<tspan x="290" dy="22">desplazar horizontalmente la barra de</tspan>
<tspan x="290" dy="22">submenús hacia la derecha</tspan>
</text>
<rect x="95.0" y="645.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="675" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Plan de Fondos para consultar</tspan>
<tspan x="290" dy="22">la distribución prevista del dinero</tspan>
</text>
<rect x="95.0" y="788.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="814" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Auditoría y Movimientos para</tspan>
<tspan x="290" dy="22">consultar recaudación, gráficos y</tspan>
<tspan x="290" dy="22">aportes recientes</tspan>
</text>
<rect x="95.0" y="945.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="975" text-anchor="middle">
<tspan x="290" dy="0">En los aportes recientes, elegir</tspan>
<tspan x="290" dy="22">Todos, Directos o Recompensas</tspan>
</text>
<rect x="95.0" y="1095.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1125" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Hitos del Proyecto para</tspan>
<tspan x="290" dy="22">consultar las etapas y su estado</tspan>
</text>
<rect x="95.0" y="1245.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1275" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Evidencias; el número junto al</tspan>
<tspan x="290" dy="22">nombre indica cuántos documentos hay</tspan>
</text>
<polygon points="290,1365.0 485.0,1430 290,1495.0 95.0,1430" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1436" text-anchor="middle">
<tspan x="290" dy="0">¿Hay evidencias públicas?</tspan>
</text>
<rect x="95.0" y="1538.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1564" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Abrir documento en la</tspan>
<tspan x="290" dy="22">evidencia elegida; se abre en otra</tspan>
<tspan x="290" dy="22">pestaña</tspan>
</text>
<rect x="95.0" y="1688.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1714" text-anchor="middle">
<tspan x="290" dy="0">Volver a la campaña y pulsar Bitácora</tspan>
<tspan x="290" dy="22">para consultar las novedades</tspan>
<tspan x="290" dy="22">publicadas</tspan>
</text>
<rect x="95.0" y="1838.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1864" text-anchor="middle">
<tspan x="290" dy="0">Para ver hitos y novedades juntos,</tspan>
<tspan x="290" dy="22">pulsar Hitos y Avances en la barra</tspan>
<tspan x="290" dy="22">principal</tspan>
</text>
<rect x="95.0" y="1995.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="2036" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>