<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 940" role="img" aria-labelledby="title desc">
<title id="title">E11 · Eliminar un borrador o campaña rechazada</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 315.0"/>
<path class="edge" d="M 290 445.0 V 465.0"/>
<text class="label" x="305" y="460.0">Sí</text>
<path class="edge" d="M 485 380 H 590"/>
<text class="label" x="535" y="370" text-anchor="middle">No</text>
<rect x="590.0" y="345.0" width="390" height="70" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="386" text-anchor="middle">
<tspan x="785" dy="0">Cancelar y regresar a la lista</tspan>
</text>
<path class="edge" d="M 290 595.0 V 645.0"/>
<text class="label" x="305" y="625.0">Sí</text>
<path class="edge" d="M 485 530 H 590"/>
<text class="label" x="535" y="520" text-anchor="middle">No</text>
<rect x="590.0" y="495.0" width="390" height="70" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="525" text-anchor="middle">
<tspan x="785" dy="0">El sistema bloquea la eliminación;</tspan>
<tspan x="785" dy="22">conservar la campaña</tspan>
</text>
<path class="edge" d="M 290 715.0 V 795.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="225" text-anchor="middle">
<tspan x="290" dy="0">Abrir el menú de la campaña y elegir</tspan>
<tspan x="290" dy="22">Eliminar</tspan>
</text>
<polygon points="290,315.0 485.0,380 290,445.0 95.0,380" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="386" text-anchor="middle">
<tspan x="290" dy="0">¿Confirmar la eliminación?</tspan>
</text>
<polygon points="290,465.0 485.0,530 290,595.0 95.0,530" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="514" text-anchor="middle">
<tspan x="290" dy="0">¿No tiene aportes ni</tspan>
<tspan x="290" dy="22">movimientos con</tspan>
<tspan x="290" dy="22">trazabilidad?</tspan>
</text>
<rect x="95.0" y="645.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="675" text-anchor="middle">
<tspan x="290" dy="0">Eliminar la campaña y comprobar que</tspan>
<tspan x="290" dy="22">ya no aparece en la lista</tspan>
</text>
<rect x="95.0" y="795.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="836" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>