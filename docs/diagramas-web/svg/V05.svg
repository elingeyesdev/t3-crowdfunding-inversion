<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1090" role="img" aria-labelledby="title desc">
<title id="title">V05 · Compartir una campaña</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 188.0"/>
<path class="edge" d="M 290 272.0 V 315.0"/>
<path class="edge" d="M 290 445.0 V 495.0"/>
<text class="label" x="305" y="475.0">Sí</text>
<path class="edge" d="M 485 380 H 590"/>
<text class="label" x="535" y="370" text-anchor="middle">Red social</text>
<rect x="590.0" y="345.0" width="390" height="70" rx="35" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="375" text-anchor="middle">
<tspan x="785" dy="0">Elegir WhatsApp, Facebook, X o</tspan>
<tspan x="785" dy="22">LinkedIn; se abre el servicio externo</tspan>
</text>
<path class="edge" d="M 290 565.0 V 645.0"/>
<path class="edge" d="M 290 715.0 V 795.0"/>
<path class="edge" d="M 290 865.0 V 945.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="188.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="214" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Compartir Campaña en la ficha,</tspan>
<tspan x="290" dy="22">o el icono de compartir de su tarjeta</tspan>
<tspan x="290" dy="22">en Explorar</tspan>
</text>
<polygon points="290,315.0 485.0,380 290,445.0 95.0,380" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="386" text-anchor="middle">
<tspan x="290" dy="0">¿Quieres copiar el enlace?</tspan>
</text>
<rect x="95.0" y="495.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="536" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Copiar enlace</tspan>
</text>
<rect x="95.0" y="645.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="675" text-anchor="middle">
<tspan x="290" dy="0">Comprobar la confirmación de copia y</tspan>
<tspan x="290" dy="22">pegarlo donde corresponda</tspan>
</text>
<rect x="95.0" y="795.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="825" text-anchor="middle">
<tspan x="290" dy="0">Cerrar la ventana para seguir</tspan>
<tspan x="290" dy="22">navegando</tspan>
</text>
<rect x="95.0" y="945.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="986" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>