<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1540" role="img" aria-labelledby="title desc">
<title id="title">E03 · Crear una campaña y guardarla como borrador</title>
<desc id="desc">Flujo vertical. Seguir las flechas de arriba hacia abajo; cada decisión tiene una alternativa rotulada. Los pasos enlazados llevan a otro diagrama de la guía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526578"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193449;font-size:18px} .label{font-size:16px;fill:#42596b} .edge{fill:none;stroke:#526578;stroke-width:1.8;marker-end:url(#arrow)} a:hover rect,a:hover polygon{stroke:#176941;stroke-width:3}</style>
<path class="edge" d="M 290 115.0 V 195.0"/>
<path class="edge" d="M 290 265.0 V 315.0"/>
<path class="edge" d="M 290 445.0 V 488.0"/>
<text class="label" x="305" y="471.5">Sí</text>
<path class="edge" d="M 485 380 H 590"/>
<text class="label" x="535" y="370" text-anchor="middle">No</text>
<a href="../index.html#E01" aria-label="Ir a E01">
<rect x="590.0" y="345.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="375" text-anchor="middle">
<tspan x="785" dy="0">Completar perfil o solicitar KYC;</tspan>
<tspan x="785" dy="22">volver cuando esté aprobado</tspan>
</text>
</a>
<path class="edge" d="M 290 572.0 V 645.0"/>
<path class="edge" d="M 290 715.0 V 788.0"/>
<path class="edge" d="M 290 872.0 V 945.0"/>
<path class="edge" d="M 290 1015.0 V 1065.0"/>
<path class="edge" d="M 290 1195.0 V 1245.0"/>
<text class="label" x="305" y="1225.0">Sí</text>
<path class="edge" d="M 485 1130 H 590"/>
<text class="label" x="535" y="1120" text-anchor="middle">No</text>
<path class="edge" d="M 980 1130 H 1010 V 530 H 485"/>
<rect x="590.0" y="1095.0" width="390" height="70" rx="8" fill="#fff8ef" stroke="#a9bdca"/>
<text x="785" y="1125" text-anchor="middle">
<tspan x="785" dy="0">Leer el error y corregir los datos</tspan>
<tspan x="785" dy="22">antes de volver a guardar</tspan>
</text>
<path class="edge" d="M 290 1315.0 V 1395.0"/>
<rect x="95.0" y="45.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="86" text-anchor="middle">
<tspan x="290" dy="0">Inicio</tspan>
</text>
<rect x="95.0" y="195.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="225" text-anchor="middle">
<tspan x="290" dy="0">Abrir Mis Campañas y pulsar Lanzar</tspan>
<tspan x="290" dy="22">Campaña</tspan>
</text>
<polygon points="290,315.0 485.0,380 290,445.0 95.0,380" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="375" text-anchor="middle">
<tspan x="290" dy="0">¿El perfil cumple los</tspan>
<tspan x="290" dy="22">requisitos?</tspan>
</text>
<rect x="95.0" y="488.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="514" text-anchor="middle">
<tspan x="290" dy="0">Completar título, eslogan,</tspan>
<tspan x="290" dy="22">descripción, categorías, meta y fecha</tspan>
<tspan x="290" dy="22">de cierre si corresponde</tspan>
</text>
<rect x="95.0" y="645.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="675" text-anchor="middle">
<tspan x="290" dy="0">Agregar portada o video si se desea;</tspan>
<tspan x="290" dy="22">definir recompensas si corresponde</tspan>
</text>
<rect x="95.0" y="788.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="814" text-anchor="middle">
<tspan x="290" dy="0">Seleccionar respaldo, escribir</tspan>
<tspan x="290" dy="22">justificación y pulsar Añadir</tspan>
<tspan x="290" dy="22">Documento</tspan>
</text>
<rect x="95.0" y="945.0" width="390" height="70" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="986" text-anchor="middle">
<tspan x="290" dy="0">Pulsar Guardar Borrador y confirmar</tspan>
</text>
<polygon points="290,1065.0 485.0,1130 290,1195.0 95.0,1130" fill="#fff6df" stroke="#a38b49"/>
<text x="290" y="1136" text-anchor="middle">
<tspan x="290" dy="0">¿Se creó correctamente?</tspan>
</text>
<rect x="95.0" y="1238.0" width="390" height="84" rx="8" fill="#eef5f9" stroke="#a9bdca"/>
<text x="290" y="1264" text-anchor="middle">
<tspan x="290" dy="0">Ver el borrador en Mis Campañas;</tspan>
<tspan x="290" dy="22">abrir vista previa y comprobar</tspan>
<tspan x="290" dy="22">archivos</tspan>
</text>
<rect x="95.0" y="1395.0" width="390" height="70" rx="35" fill="#e4f1df" stroke="#a9bdca"/>
<text x="290" y="1436" text-anchor="middle">
<tspan x="290" dy="0">Fin</tspan>
</text>
</svg>