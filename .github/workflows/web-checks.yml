name: Web checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: React, build and PHP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, pdo_sqlite, fileinfo, dom, xml
          tools: composer:v2
          coverage: none
      - name: Prepare isolated test configuration
        run: cp .env.example .env
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate test application key
        run: php artisan key:generate --ansi
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install JavaScript dependencies
        run: npm ci
      - name: React regression tests
        run: npm test
      # Build before PHP tests: several web route tests render the Vite entrypoint.
      - name: Compile TypeScript and production assets
        run: npm run build
      - name: PHP regression tests
        run: composer test
